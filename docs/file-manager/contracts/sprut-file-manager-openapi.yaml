  "/api/v1/nodes/{nodeId}/content":
    get:
      tags: [ "Content" ]
      summary: "Скачать current или конкретную версию"
      operationId: "downloadContent"
      description: "FILE только; выбранная immutable version защищается CONTENT_READ hold с bounded deadline до окончания I/O. Charset/MIME берутся из версии. После начала body ошибка означает обрыв, не JSON. Чужой versionId — 404; известная retired версия — 410. Strong ETag и одиночные Range проверяются до ответа; безопасный filename и nosniff обязательны."
      x-permission: "READ"
      x-legacy-operation: "GET /api/s3/{bucket}/object?key=&versionId=; GET /api/s3/{bucket}/object/**"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/OptionalVersion"
        - $ref: "#/components/parameters/Range"
        - $ref: "#/components/parameters/IfNoneMatch"
        - name: If-Range
          in: header
          required: false
          schema: { type: string, maxLength: 1024 }
          description: "Условие применения Range: strong ETag либо HTTP-date. При несовпадении выбранной immutable версии Range игнорируется и возвращается полный файл с 200. Weak ETag не совпадает."
        - name: disposition
          in: query
          schema:
            type: string
            enum:
              - INLINE
              - ATTACHMENT
            default: ATTACHMENT
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200":
          description: "Поток bytes; пустой файл — 200 с Content-Length: 0, не 204."
          headers:
            ETag: { "$ref": "#/components/headers/ETag" }
            X-Content-Revision-ETag: { "$ref": "#/components/headers/ContentRevisionETag" }
            Accept-Ranges:
              schema:
                type: "string"
                enum: [ "bytes" ]
            Content-Length:
              schema: { "type": "integer", "format": "int64", "minimum": 0 }
            Content-Disposition:
              schema: { "type": "string", "maxLength": 1024 }
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
          content:
            "application/octet-stream":
              schema: { "type": "string", "format": "binary" }
        "206":
          description: "Один запрошенный диапазон bytes."
          headers:
            ETag: { "$ref": "#/components/headers/ETag" }
            X-Content-Revision-ETag: { "$ref": "#/components/headers/ContentRevisionETag" }
            Accept-Ranges:
              schema:
                type: "string"
                enum: [ "bytes" ]
            Content-Length:
              schema: { "type": "integer", "format": "int64", "minimum": 0 }
            Content-Disposition:
              schema: { "type": "string", "maxLength": 1024 }
            Content-Range: { "$ref": "#/components/headers/ContentRange" }
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
          content:
            "application/octet-stream":
              schema: { "type": "string", "format": "binary" }
        "304": { "description": "Версия не изменилась.", headers: { X-Correlation-Id: { $ref: "#/components/headers/Correlation" } } }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "410": { "$ref": "#/components/responses/Gone" }
        "416":
          description: "Range invalid/unsatisfiable; Content-Range bytes */size."
          headers:
            Content-Range: { "$ref": "#/components/headers/ContentRange" }
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
          content:
            "application/problem+json":
              schema: { "$ref": "#/components/schemas/Problem" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
