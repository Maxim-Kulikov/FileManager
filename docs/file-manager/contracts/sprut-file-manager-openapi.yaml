# Sprut File Manager API.
# Самостоятельный файл без внешних $ref. Context path находится в servers.
# x-db-status=extension-required: реализация требует расширения модели PUML/БД.
openapi: "3.0.3"
info:
  title: "Sprut File Manager API"
  version: "0.5.0-design"
  description: |-
    Операции с файлами, папками, версиями, правами доступа и корректорами. Прямая запись по физическим bucket/key не предоставляется.

    Context path /sprut-file-manager задаётся servers ровно один раз. Paths ниже начинаются /api/v1. PostgreSQL — namespace/ACL/versions/jobs; immutable bytes — S3/MinIO; OpenSearch — eventual projection. Внутренние задания без Kafka.

    Внутренняя аутентификация: mTLS/workload identity и caller allowlist. Gateway проверяет пользовательский токен и заменяет все клиентские X-Actor-*; File Manager принимает X-Actor-Id/Type/Roles/Groups только от разрешённого caller. Tenant — постоянный sprut.file-manager.tenant-id из YAML/env, не claims/body/header. Пользовательский Bearer не требуется на этом интерфейсе. READ metadata/bytes; WRITE create/content/markers; DELETE trash; SHARE links/holds; ADMIN ACL/retention/purge/index. В любом запросе проверяются scope, ancestor visibility и права. READ_ONLY запрещает пользовательские изменения, DISABLED пользовательский доступ. Чужие IDs маскируются 404.

    If-Match для node metadata: сильный ETag "node:<nodeId>:<revision>". Для content: "content:<nodeId>:<contentRevision>". Из GET берётся нужный ETag; If-Match=* запрещён. 428 если header отсутствует, 412 если не совпадает. Content CAS и metadata CAS различаются. HEAD/GET bytes ETag относится к immutable версии, не к node metadata.

    POST создания/массовых операций требует Idempotency-Key (1..255 chars). Scope включает tenant+actor+operation+resource, hash нормализованной команды; одинаковый key/body возвращает прежний ресурс, другой body — 409. Эффективный TTL через capabilities; idempotency запись не разрешает повторное создание после удаления результата: 410. Проверка current авторизации перед replay. Документированные retries complete/cancel естественно идемпотентны.

    Большие операции: 202 только после DB commit. Частичные результаты, per-file CAS, отсутствуют auto-merge/last writer wins. Отмена не разрешает новые commit после CANCEL_REQUESTED. STOP_AND_ROLLBACK — durable связанный workflow, не atomic global rollback. Конфликты с чужими изменениями сохраняются.

    Пагинация bounded/keyset. UUID в URL, paths только query/display; double decoding запрещено. Даты: RFC3339 с offset/Z; хранение в UTC. Ограничения body/файлов/transform/TTL определяет capabilities; schema maxima ограничивают входные данные и не задают SLO. Ошибки application/problem+json; 503 с Retry-After.

    Модель PUML включает COPY/DELETE/EXPORT, cancel+rollback intent, export_artifact, upload_attempt, retry lineage, rule-set revision и VERSION_RESTORE. x-db-status=covered означает наличие необходимых сущностей в модели БД. x-db-model описывает используемые сущности. Подробности в sprut-file-manager-openapi-notes.md.

    Дерево PostgreSQL: parent_id и внутренний tree_path LTREE у папок; FILE имеет NULL. Технический путь состоит из UUID, не имён, и не передаётся в REST. Потомки выбираются через ltree папок, файлы через JOIN родителя; ACL и видимость предков проверяются отдельно. Move папки атомарно меняет пути всех вложенных папок в пределах maxAtomicMoveFolders, иначе 413 RESOURCE_LIMIT_EXCEEDED. История хранит parent links, не технический prefix.

    Одна конфигурация MinIO и одна OpenSearch задаются серверным YAML для всех пространств. REST/MVC принимают metadata и права, без выбора подключения. Все spaces используют общий bucket с уникальным prefix и общий index alias с tenantId/spaceId filters. PostgreSQL хранит размещение/fingerprints, не client configuration или secrets.

    Файловые роли принадлежат одному space. Внешняя система назначает role UUID субъектам; локальных user-role memberships нет. Текущие role_permission + node_acl ROLE bindings определяют права, а не переданные permission masks. Прямые USER/GROUP/SERVICE grants сохраняются. ADMIN — существующее файловое право, не platform administrator; READ/WRITE автоматически не включает. Platform grants задаются доверенной серверной политикой и не выдаются файловой ролью.

    correlationId независим от traceId/spanId, jobId и Idempotency-Key. Допустимый входной X-Correlation-Id сохраняется; отсутствующий генерируется. Невалидный/дублирующийся header даёт 400 с новым безопасным ID. Все HTTP-ответы приложения содержат X-Correlation-Id. В job durable сохраняется ограниченный контекст без токенов. Актуальность внешнего назначения роли требует утверждённого resolver/expiry протокола; устаревший или непроверяемый контекст не разрешает worker commit.
  contact: { "name": "Sprut" }
servers:
  - url: "/sprut-file-manager"
    description: "Context path; пример полного URL /sprut-file-manager/api/v1/jobs/{jobId}"
security:
  - TrustedActorId: []
    TrustedActorType: []
tags:
  - name: Capabilities
    description: Ограничения и контекст
  - name: Spaces
    description: Пространства и доступное хранилище
  - name: Nodes
    description: Файлы, папки, пути и маркеры
  - name: Content
    description: Потоковые загрузки и скачивание
  - name: Versions
    description: История и удержание версий
  - name: Search
    description: Metadata и full-text поиск
  - name: Correctors
    description: Шаблоны и типизированные правила
  - name: Jobs
    description: Прогресс, результаты, отмена и компенсация
  - name: Access
    description: ACL
  - name: Administration
    description: Retention, индексация, GC, аудит
  - name: Roles
    description: Каталог ролей и поддерживаемых действий; membership принадлежит внешней системе
  - name: Setup
    description: Первоначальная настройка без автоматического создания пространства
paths:
  "/api/v1/capabilities":
    get:
      tags: [ "Capabilities" ]
      summary: "Эффективные ограничения и поддерживаемые функции"
      operationId: "getCapabilities"
      description: "Эффективные ограничения и поддерживаемые функции"
      x-permission: "READ"
      x-legacy-operation: "GET /api/v2/s3/credentials → доступный контекст без credentials"
      x-db-status: "covered"
      parameters:
        - name: spaceId
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200":
          description: "Ограничения конкретной identity/space."
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/Capabilities" }
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/api/v1/spaces":
    get:
      tags: [ "Spaces" ]
      summary: "Доступные пользователю пространства"
      operationId: "listSpaces"
      description: "Доступные пользователю пространства"
      x-permission: "READ"
      x-legacy-operation: "GET /api/v2/s3/credentials"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200":
          description: "Только разрешённые spaces."
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/SpacePage" }
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
    post:
      tags: [ "Spaces" ]
      summary: "Создать пространство и корень"
      operationId: "createSpace"
      description: "CREATE_SPACE из серверной platform policy. Tenant и общие MinIO/OpenSearch берутся из YAML. В запросе только name, retentionPolicyId и initialAccess; endpoint, bucket, prefix, index и credentials запрещены. Все пространства используют общий bucket и index alias. Сервер выделяет prefix base/spaces/spaceId/ и фиксирует fingerprints размещения. Одна TX создаёт space/root/history/initial ACL/audit/index task/idempotency. Минимум один USER/SERVICE grant READ+ADMIN, SUBTREE. Роли создаются после space. Root FOLDER создаётся с tree_path=label(rootId); технический путь не возвращается."
      x-permission: "CREATE_SPACE"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/Idempotency"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/CreateSpace" }
      responses:
        "201":
          description: "Space/root созданы."
          headers:
            Location: { "$ref": "#/components/headers/Location" }
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/Space" }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "413": { "$ref": "#/components/responses/PayloadTooLarge" }
        "422": { "$ref": "#/components/responses/Unprocessable" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/api/v1/spaces/{spaceId}":
    get:
      tags: [ "Spaces" ]
      summary: "Пространство и доступное окно восстановления"
      operationId: "getSpace"
      description: "Пространство и доступное окно восстановления"
      x-permission: "READ"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200":
          description: "Metadata пространства."
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/Space" }
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
    patch:
      tags: [ "Spaces" ]
      summary: "Изменить имя, состояние или retention пространства"
      operationId: "updateSpace"
      description: "Изменить имя, состояние или retention пространства"
      x-permission: "ADMIN"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/SpaceIfMatch"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/UpdateSpace" }
      responses:
        "200":
          description: "Новое состояние."
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/Space" }
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "413": { "$ref": "#/components/responses/PayloadTooLarge" }
        "422": { "$ref": "#/components/responses/Unprocessable" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"
  "/api/v1/spaces/{spaceId}/storage-status":
    get:
      tags: [ "Spaces" ]
      summary: "Статус логического и native S3 versioning"
      operationId: "getStorageStatus"
      description: "Статус логического и native S3 versioning"
      x-permission: "ADMIN"
      x-legacy-operation: "GET /api/s3/{bucket}/versioning"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200":
          description: "Без секретов/произвольного bucket."
          content:
            "application/json":
              schema: { "$ref": "#/components/schemas/StorageStatus" }
          headers:
            X-Correlation-Id:
              $ref: "#/components/headers/Correlation"
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/api/v1/spaces/{spaceId}/nodes":
    post:
      tags: [ "Nodes" ]
      summary: "Создать папку или metadata пустого файла"
      operationId: "createNode"
      description: "Создать папку или metadata пустого файла. FOLDER получает parent.tree_path || label(nodeId), FILE tree_path=NULL; клиент не задаёт технический путь."
      x-permission: "WRITE"
      x-legacy-operation: "PUT /api/s3/{bucket}/folder; PUT /api/s3/{bucket}/file (bytes через upload session)"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - $ref: "#/components/parameters/Idempotency"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/CreateNode" }
      responses:
        "201": { "$ref": "#/components/responses/CreatedNode" }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "413": { "$ref": "#/components/responses/PayloadTooLarge" }
        "422": { "$ref": "#/components/responses/Unprocessable" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/api/v1/spaces/{spaceId}/nodes/resolve":
    get:
      tags: [ "Nodes" ]
      summary: "Найти узел по логическому пути"
      operationId: "resolveNodeByPath"
      description: "Совместимость path-based потребителей. Resolve затем mutation по ID+revision: rename/move между вызовами не меняет цель. includeTrashed не разрешает читать под скрытым/недоступным ancestor."
      x-permission: "READ"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/SpaceId"
        - name: path
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/LogicalPath"
        - name: includeTrashed
          in: query
          schema:
            type: boolean
            default: false
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200": { "$ref": "#/components/responses/Node" }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
  "/api/v1/nodes/{nodeId}":
    get:
      tags: [ "Nodes" ]
      summary: "Metadata файла/папки с markers и revision"
      operationId: "getNode"
      description: "Metadata файла/папки с markers и revision"
      x-permission: "READ"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      responses:
        "200": { "$ref": "#/components/responses/Node" }
        "304": { "description": "Metadata не изменилась.", headers: { X-Correlation-Id: { $ref: "#/components/headers/Correlation" } } }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
    patch:
      tags: [ "Nodes" ]
      summary: "Переименовать файл или папку"
      operationId: "renameNode"
      description: "Rename не копирует S3 bytes. Имя уникально среди ACTIVE siblings. История/audit/index task в одной TX; путь потомков в OpenSearch обновляется eventual. tree_path не меняется: UUID-метки не содержат имён."
      x-permission: "WRITE"
      x-legacy-operation: "Frontend list+copy/delete key mutations → explicit stable-ID rename"
      x-db-status: "covered"
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/ActorId"
        - $ref: "#/components/parameters/ActorType"
        - $ref: "#/components/parameters/ActorRoles"
        - $ref: "#/components/parameters/ActorGroups"
        - $ref: "#/components/parameters/Correlation"
        - $ref: "#/components/parameters/TraceParent"
        - $ref: "#/components/parameters/TraceState"
      requestBody:
        required: true
        content:
          "application/json":
            schema: { "$ref": "#/components/schemas/RenameNode" }
      responses:
        "200": { "$ref": "#/components/responses/Node" }
        "400": { "$ref": "#/components/responses/BadRequest" }
        "401": { "$ref": "#/components/responses/Unauthorized" }
        "403": { "$ref": "#/components/responses/Forbidden" }
        "404": { "$ref": "#/components/responses/NotFound" }
        "409": { "$ref": "#/components/responses/Conflict" }
        "412": { "$ref": "#/components/responses/PreconditionFailed" }
        "413": { "$ref": "#/components/responses/PayloadTooLarge" }
        "422": { "$ref": "#/components/responses/Unprocessable" }
        "428": { "$ref": "#/components/responses/PreconditionRequired" }
        "503": { "$ref": "#/components/responses/Unavailable" }
        default: { "$ref": "#/components/responses/Problem" }
    delete:
      tags: [ "Nodes" ]
      summary: "Переместить узел в корзину"
      operationId: "trashNode"
      description: "Логическое удаление, не physical S3 wipe. FOLDER скрывает subtree через ancestor visibility; root удалить нельзя. История и bytes остаются согласно retention/holds. Повтор при старом If-Match — 412; безопасный retry через GET. tree_path сохраняется, скрытые предки проверяются независимо от принадлежности ltree."
      x-permission: "DELETE"
