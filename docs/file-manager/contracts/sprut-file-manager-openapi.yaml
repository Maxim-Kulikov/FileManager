        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    TrustedActorId:
      type: apiKey
      in: header
      name: X-Actor-Id
      description: OpenAPI 3.0 не моделирует mTLS отдельным типом security scheme. Заголовок обозначает pre-authenticated actor, не секрет/API key; caller authentication обязательна по x-transport-security.
    TrustedActorType:
      type: apiKey
      in: header
      name: X-Actor-Type
      description: USER или SERVICE. Доверие только после caller authentication и проверки разрешённого режима делегирования.
  parameters:
    SpaceId:
      name: "spaceId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    NodeId:
      name: "nodeId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    VersionId:
      name: "versionId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    UploadId:
      name: "uploadId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    RuleSetId:
      name: "ruleSetId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    RuleVersionId:
      name: "ruleVersionId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    JobId:
      name: "jobId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    AclId:
      name: "aclId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    HoldId:
      name: "holdId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    PolicyId:
      name: "policyId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    GcTaskId:
      name: "gcTaskId"
      in: "path"
      required: true
      schema: { "$ref": "#/components/schemas/UUID" }
    PageSize:
      name: "pageSize"
      in: "query"
      schema: { "type": "integer", "minimum": 1, "maximum": 1000, "default": 100 }
      description: "Эффективный maxPageSize из capabilities, не больше 1000."
    Cursor:
      name: "cursor"
      in: "query"
      schema: { "type": "string", "maxLength": 8192 }
      description: "Opaque tenant/query-bound cursor. Не модифицировать; filter mismatch 400, expired 410."
    IfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema:
        type: "string"
        maxLength: 128
        pattern: "^\"node:[0-9a-fA-F-]{36}:[0-9]+\"$"
        example: "\"node:123e4567-e89b-12d3-a456-426614174000:7\""
      description: "Сильный ETag metadata из GET node. Нет header → 428; mismatch → 412. Wildcard запрещён."
    ContentIfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema: { "type": "string", "maxLength": 128, "pattern": "^\"content:[0-9a-fA-F-]{36}:[0-9]+\"$" }
      description: "ETag содержимого из HEAD/GET content (X-Content-Revision-ETag) либо current FileContent. Проверяется contentRevision; версия для чтения bytes имеет отдельный ETag."
    RuleIfMatch:
      name: "If-Match"
      in: "header"
      required: true
      schema: { "type": "string", "maxLength": 128, "pattern": "^\"rule-set:[0-9a-fA-F-]{36}:[0-9]+\"$" }
      description: "Metadata ETag шаблона; CAS использует corrector_rule_set.revision."
    Idempotency:
      name: "Idempotency-Key"
      in: "header"
      required: true
      schema: { "type": "string", "maxLength": 255, "minLength": 1, "pattern": "^[A-Za-z0-9._:-]+$" }
      description: "Один key на логическую команду. Повтор body возвращает прежний ресурс; другой body 409. Инициатор/operation/resource входят в scope."
    OptionalVersion:
      name: "versionId"
      in: "query"
      schema: { "$ref": "#/components/schemas/UUID" }
      description: "Без параметра фиксируем current version на начало чтения. Конкретная версия обязана принадлежать nodeId."
    Recursive:
      name: "recursive"
      in: "query"
      schema: { "type": "boolean", "default": false }
    NodeType:
      name: "type"
      in: "query"
      schema:
        type: "string"
        enum: [ "FILE", "FOLDER", "ALL" ]
        default: "ALL"
    Range:
      name: "Range"
      in: "header"
      schema: { "type": "string", "maxLength": 128, "pattern": "^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$" }
      description: "Один bytes range: start-end, start-, -suffix. Несколько диапазонов не поддерживаются; invalid/unsatisfiable → 416 с Content-Range bytes */size."
    IfNoneMatch:
      name: "If-None-Match"
      in: "header"
      schema: { "type": "string", "maxLength": 128 }
      description: "Условное чтение immutable bytes/metadata; совпадение → 304, без body."
    ActorId:
      name: X-Actor-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
      description: Ровно один UUID; gateway заменяет входное клиентское значение. Внешние body IDs не являются альтернативой identity.
    ActorType:
      name: X-Actor-Type
      in: header
      required: true
      schema:
        type: string
        enum:
          - USER
          - SERVICE
      description: Ровно одно значение. SERVICE ID сопоставлен caller; USER допускается только разрешённым делегирующим caller.
    ActorRoles:
      name: X-Actor-Roles
      in: header
      required: false
      style: simple
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          maxLength: 36
        minItems: 0
        maxItems: 128
        uniqueItems: true
      description: Локальные role UUID, подтверждённые разрешённым issuer/caller; внешняя система назначает membership. Неизвестные/ARCHIVED роли не дают прав. Один header с comma-separated списком; повторные HTTP headers отклоняются.
    ActorGroups:
      name: X-Actor-Groups
      in: header
      required: false
      style: simple
      explode: false
      schema:
        type: array
        items:
          type: string
          format: uuid
          maxLength: 36
        minItems: 0
        maxItems: 128
        uniqueItems: true
      description: Внешние UUID групп для сохранённых GROUP grants; доверенная identity, не произвольный ввод клиента. Один header с comma-separated списком; повторные HTTP headers отклоняются.
    Correlation:
      name: X-Correlation-Id
      in: header
      required: false
      schema:
        $ref: "#/components/schemas/CorrelationId"
      description: Опциональный безопасный ID интеграции; без header генерируется UUID. Невалидное/пустое/дублирующееся значение — 400 с новым безопасным ID.
    TraceParent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
      description: Контекст обрабатывает tracing instrumentation. Некорректный контекст заменяется новой trace; не используется как identity.
    TraceState:
      name: tracestate
      in: header
      required: false
      schema:
        type: string
      description: Переносится по политике tracing, не сохраняется вместе с произвольным baggage или секретами.
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        maxLength: 36
    ConnectionIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: ^"connection:[0-9a-fA-F-]{36}:[0-9]+"$
      description: Обязательный сильный ETag; отсутствие 428, несовпадение 412. Wildcard запрещён.
    RoleIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: ^"role:[0-9a-fA-F-]{36}:[0-9]+"$
      description: Обязательный сильный ETag; отсутствие 428, несовпадение 412. Wildcard запрещён.
    SpaceIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 128
        pattern: ^"space:[0-9a-fA-F-]{36}:[0-9]+"$
      description: Обязательный сильный ETag; отсутствие 428, несовпадение 412. Wildcard запрещён.
  headers:
    ETag:
      description: "Сильный ETag выбранной representation."
      schema: { "type": "string", "maxLength": 128 }
    ContentRevisionETag:
      description: "Отдельный CAS токен текущего содержимого: \"content:<nodeId>:<contentRevision>\". Применяется для restore/save, не byte cache."
      schema: { "type": "string", "maxLength": 128 }
    Location:
      description: "Относительный URI включает /sprut-file-manager ровно один раз."
      schema: { "type": "string", "maxLength": 2048 }
    RetryAfter:
      description: "Рекомендуемая задержка в секундах."
      schema: { "type": "integer", "minimum": 1 }
    RequestId:
      description: "Legacy диагностический заголовок; не удостоверяет identity и не заменяет X-Correlation-Id."
      schema: { "type": "string", "maxLength": 128 }
    ContentRange:
      description: "bytes start-end/size либо bytes */size для 416."
      schema: { "type": "string", "maxLength": 128 }
    Correlation:
      description: Принятый либо сгенерированный correlationId. Есть во всех ответах приложения; не гарантируется при отказе до приложения.
      schema:
        $ref: "#/components/schemas/CorrelationId"
  responses:
    Problem:
      description: "Machine-readable error. Возможные коды и статусы описаны в info и operation. После начала streaming новый HTTP error response невозможен."
      headers:
        X-Request-ID: { "$ref": "#/components/headers/RequestId" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
    BadRequest:
      description: "400: структура, path/cursor/header validation."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Unauthorized:
      description: "401: нет действительной identity."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Forbidden:
      description: "403: недостаточно прав или space READ_ONLY/DISABLED."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    NotFound:
      description: "404: ресурс отсутствует либо недоступен в tenant/space."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Conflict:
      description: "409: name collision, cycle, base content conflict, job state, retained reference; исчерпание квоты QUOTA_EXCEEDED или лимита активных заданий TOO_MANY_ACTIVE_JOBS."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Gone:
      description: "410: version/job detail/artifact/cursor/restore point уже очищены."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    PreconditionFailed:
      description: "412: If-Match не совпадает."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    PreconditionRequired:
      description: "428: отсутствует обязательный If-Match."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    PayloadTooLarge:
      description: "413: body/upload/roots/rules лимит."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    UnsupportedMedia:
      description: "415: недопустимый content type/charset."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Unprocessable:
      description: "422: semantic rule/layout/plugin validation."
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
      headers:
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
    Unavailable:
      description: "503: зависимость недоступна; операция может иметь неизвестный исход, проверять idempotency/resource прежде повтора."
      headers:
        Retry-After: { "$ref": "#/components/headers/RetryAfter" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/problem+json":
          schema: { "$ref": "#/components/schemas/Problem" }
    Node:
      description: "Актуальные metadata узла."
      headers:
        ETag: { "$ref": "#/components/headers/ETag" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Node" }
    CreatedNode:
      description: "Узел создан атомарно."
      headers:
        ETag: { "$ref": "#/components/headers/ETag" }
        Location: { "$ref": "#/components/headers/Location" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Node" }
    AcceptedJob:
      description: "Задание зафиксировано; не означает завершения. Poll GET jobs/{jobId}."
      headers:
        Location: { "$ref": "#/components/headers/Location" }
        Retry-After: { "$ref": "#/components/headers/RetryAfter" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Job" }
    Job:
      description: "Текущее состояние и кэш прогресса."
      headers:
        Retry-After: { "$ref": "#/components/headers/RetryAfter" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Job" }
    Upload:
      description: "Session status; bytes ещё могут быть не опубликованы."
      headers:
        Location: { "$ref": "#/components/headers/Location" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Upload" }
    RuleSet:
      description: "Metadata шаблона."
      headers:
        ETag: { "$ref": "#/components/headers/ETag" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/RuleSet" }
    Version:
      description: "Immutable version metadata."
      headers:
        ETag: { "$ref": "#/components/headers/ETag" }
        X-Correlation-Id:
          $ref: "#/components/headers/Correlation"
      content:
        "application/json":
          schema: { "$ref": "#/components/schemas/Version" }
    NoContent: { "description": "Успешно, response body отсутствует.", headers: { X-Correlation-Id: { $ref: "#/components/headers/Correlation" } } }
  schemas:
    UUID: { "type": "string", "maxLength": 36, "format": "uuid" }
    Timestamp: { "type": "string", "format": "date-time" }
    Revision: { "type": "integer", "format": "int64", "minimum": 1 }
    NodeName:
      type: "string"
      maxLength: 255
      minLength: 1
      pattern: "^[^/\\\\\\u0000-\\u001F\\u007F]+$"
      description: "Один сегмент имени, не путь. '.' и '..' запрещены. Unicode NFC; proposed case-sensitive uniqueness внутри родителя. Политика фиксируется до миграции."
    LogicalPath:
      type: "string"
      maxLength: 4096
      minLength: 1
      pattern: "^/"
      description: "Абсолютный логический путь внутри space, '/' — корень. Папки с trailing slash; файлы без него. Нет пустых сегментов, '.'/'..', backslash и двойного декодирования. Физический S3 key не принимается."
    Marker:
      type: "string"
      enum: [ "TEST_CASE", "REFERENCE", "NEEDS_REVIEW" ]
      description: "Начальные стабильные UI-коды; расширение требует совместимого изменения CHECK/writers. Не права и не статус прогона."
    Markers:
      type: "array"
      items: { "$ref": "#/components/schemas/Marker" }
      maxItems: 3
      uniqueItems: true
      default: []
      description: "Без null и дублей; стабильная сортировка. Нет наследования от папки."
    Problem:
      type: "object"
      additionalProperties: false
      properties:
        type: { "type": "string", "maxLength": 2048, "format": "uri", "example": "urn:sprut:problem:revision-mismatch" }
        title: { "type": "string", "maxLength": 255 }
        status: { "type": "integer", "format": "int64", "minimum": 400, "maximum": 599 }
        code:
          type: string
          maxLength: 64
          description: "Стабильный код ошибки. Клиент должен иметь fallback для новых кодов."
          enum:
            - VALIDATION_ERROR
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - SPACE_READ_ONLY
            - SPACE_DISABLED
            - RESOURCE_NOT_FOUND
            - NAME_COLLISION
            - INVALID_MOVE
            - NODE_TYPE_MISMATCH
            - CONTENT_NOT_READY
            - REVISION_MISMATCH
            - CONTENT_REVISION_MISMATCH
            - CURSOR_MISMATCH
            - CURSOR_EXPIRED
            - IDEMPOTENCY_KEY_REUSED
            - IDEMPOTENCY_RESULT_EXPIRED
            - UPLOAD_SIZE_MISMATCH
            - CHECKSUM_MISMATCH
            - UPLOAD_EXPIRED
            - UPLOAD_ALREADY_COMPLETED
            - UPLOAD_WRITER_CONFLICT
            - UPLOAD_ABORTED
            - MEDIA_TYPE_UNSUPPORTED
            - RULE_INVALID
            - ENGINE_UNSUPPORTED
            - PLUGIN_UNSUPPORTED
            - TRANSFORM_LIMIT_EXCEEDED
            - RESOURCE_LIMIT_EXCEEDED
            - QUOTA_EXCEEDED
            - TOO_MANY_ACTIVE_JOBS
            - VERSION_PROTECTED
            - VERSION_EXPIRED
            - RESTORE_POINT_EXPIRED
            - JOB_STATE_CONFLICT
            - JOB_DETAILS_EXPIRED
            - JOB_ROLLBACK_EXPIRED
            - REBASE_REQUIRED
            - ROLLBACK_UNSUPPORTED
            - ARTIFACT_NOT_READY
            - ARTIFACT_EXPIRED
            - INDEX_ACTION_NOT_ALLOWED
            - GC_TASK_STATE_CONFLICT
            - DEPENDENCY_UNAVAILABLE
            - INTERNAL_ERROR
            - RANGE_NOT_SATISFIABLE
            - REQUEST_BODY_TOO_LARGE
            - PATH_INVALID
            - ROLE_ARCHIVED
            - ROLE_SCOPE_MISMATCH
            - NOT_CONFIGURED
            - AUTHORIZATION_CONTEXT_EXPIRED
            - BAD_IDENTITY_CONTEXT
        detail: { "type": "string", "maxLength": 2048 }
        instance: { "type": "string", "maxLength": 2048 }
        requestId: { "type": "string", "maxLength": 128 }
        violations:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              field: { "type": "string", "maxLength": 255 }
              code: { "type": "string", "maxLength": 64 }
              message: { "type": "string", "maxLength": 1024 }
            required: [ "field", "code", "message" ]
          maxItems: 100
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
        traceId:
          type: string
          pattern: ^[0-9a-f]{32}$
          nullable: true
      required:
        - type
        - title
        - status
        - code
        - requestId
        - correlationId
      description: "application/problem+json. Без stacktrace, credentials, file bytes и недоступных путей. 404 маскирует недоступный tenant/space/node. 412 — If-Match, 409 — бизнес-конфликт, 410 — известный удалённый/expired ресурс."
      example:
        type: "urn:sprut:problem:revision-mismatch"
        title: "Revision mismatch"
        status: 412
        code: "REVISION_MISMATCH"
        requestId: "request-123"
        detail: "Узел изменён. Получите актуальные metadata."
        correlationId: request-123
    Capabilities:
      type: "object"
      additionalProperties: false
      properties:
        maxPageSize: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000 }
        maxAtomicMoveFolders: { "type": "integer", "format": "int64", "minimum": 1, "description": "Максимум FOLDER при одном atomic prefix rewrite, включая source и TRASHED/PURGING потомков. Превышение — 413 RESOURCE_LIMIT_EXCEEDED без изменения дерева." }
        maxRootsPerRequest: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000 }
        maxJsonBodyBytes: { "type": "integer", "format": "int64", "minimum": 1 }
        maxFileBytes: { "type": "integer", "format": "int64", "minimum": 0 }
        maxTransformInputBytes: { "type": "integer", "format": "int64", "minimum": 1 }
        maxTransformOutputBytes: { "type": "integer", "format": "int64", "minimum": 1 }
        maxRegexTimeMs: { "type": "integer", "format": "int64", "minimum": 1 }
        maxRulesPerVersion: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000 }
        maxPresignTtlSeconds: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 3600 }
        maxUploadSessionTtlSeconds: { "type": "integer", "format": "int64", "minimum": 1 }
        maxStreamDurationSeconds: { "type": "integer", "format": "int64", "minimum": 1 }
        maxConcurrentJobsPerTenant: { "type": "integer", "format": "int64", "minimum": 1 }
        idempotencyTtlSeconds: { "type": "integer", "format": "int64", "minimum": 1 }
        recommendedPollIntervalSeconds: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 60 }
        markerCodes:
          type: "array"
          items: { "$ref": "#/components/schemas/Marker" }
          maxItems: 3
        correctorTypes:
          type: "array"
          items: { "type": "string", "maxLength": 64 }
          maxItems: 100
        engineVersions:
          type: "array"
          items: { "type": "string", "maxLength": 64 }
          maxItems: 100
        copyAcrossSpaces: { "type": "boolean" }
        nameCasePolicy:
          type: "string"
          enum: [ "CASE_SENSITIVE", "CASE_INSENSITIVE" ]
        maxDepth:
          type: integer
          minimum: 1
          maximum: 128
          description: Максимальная глубина узла от root=0; FOLDER nlevel(tree_path)-1, FILE nlevel(parent.tree_path). Проверяется при create/upload complete/move.
      required:
        - maxPageSize
        - maxAtomicMoveFolders
        - maxRootsPerRequest
        - maxJsonBodyBytes
        - maxFileBytes
        - maxTransformInputBytes
        - maxTransformOutputBytes
        - maxRegexTimeMs
        - maxRulesPerVersion
        - maxPresignTtlSeconds
        - maxUploadSessionTtlSeconds
        - maxStreamDurationSeconds
        - maxConcurrentJobsPerTenant
        - idempotencyTtlSeconds
        - recommendedPollIntervalSeconds
        - markerCodes
        - correctorTypes
        - engineVersions
        - copyAcrossSpaces
        - nameCasePolicy
        - maxDepth
      description: "Эффективные ограничения пользователя/space. Размеры и ресурсы зависят от конфигурации; производственная capacity подтверждается нагрузочными испытаниями. Нет ограничения общего дерева размером HTTP body: в body только корни."
    Space:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 36
          format: uuid
        name:
          $ref: "#/components/schemas/NodeName"
        rootNodeId:
          type: string
          maxLength: 36
          format: uuid
        status:
          type: string
          enum:
            - ACTIVE
            - READ_ONLY
            - DISABLED
        retentionPolicyId:
          type: string
          maxLength: 36
          format: uuid
        restoreAvailableFrom:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int64
          minimum: 1
      required:
        - id
        - name
        - rootNodeId
        - status
        - retentionPolicyId
        - restoreAvailableFrom
        - createdAt
        - updatedAt
        - revision
    CreateSpace:
      type: object
      additionalProperties: false
      properties:
        name:
          $ref: "#/components/schemas/NodeName"
        retentionPolicyId:
          type: string
          maxLength: 36
          format: uuid
        initialAccess:
          type: array
          items:
            $ref: "#/components/schemas/CreateDirectAcl"
          minItems: 1
          maxItems: 1000
      required:
        - name
        - retentionPolicyId
        - initialAccess
      description: "CREATE_SPACE из серверной platform policy. Tenant и общие MinIO/OpenSearch берутся из YAML. В запросе только name, retentionPolicyId и initialAccess; endpoint, bucket, prefix, index и credentials запрещены. Все пространства используют общий bucket и index alias. Сервер выделяет prefix base/spaces/spaceId/ и фиксирует fingerprints размещения. Одна TX создаёт space/root/history/initial ACL/audit/index task/idempotency. Минимум один USER/SERVICE grant READ+ADMIN, SUBTREE. Роли создаются после space."
    UpdateSpace:
      type: "object"
      additionalProperties: false
      properties:
        name: { "$ref": "#/components/schemas/NodeName" }
        status:
          type: "string"
          enum: [ "ACTIVE", "READ_ONLY", "DISABLED" ]
        retentionPolicyId: { "type": "string", "maxLength": 36, "format": "uuid" }
      minProperties: 1
      description: "CAS через If-Match space:UUID:revision. Меняются только name/status/retentionPolicyId. Общие подключения задаются YAML, не PATCH. Смена размещения требует migration/rebuild/cutover."
    StorageStatus:
      type: "object"
      additionalProperties: false
      properties:
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        logicalVersioning:
          type: "string"
          enum: [ "ENABLED" ]
        nativeVersioning:
          type: "string"
          enum: [ "ENABLED", "SUSPENDED", "UNVERSIONED", "UNKNOWN" ]
        directCredentialsAvailable:
          type: "boolean"
          enum: [ false ]
      required: [ "spaceId", "logicalVersioning", "nativeVersioning", "directCredentialsAvailable" ]
    FileContent:
      type: "object"
      additionalProperties: false
      properties:
        currentVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        contentRevision: { "type": "integer", "format": "int64", "minimum": 0 }
        sizeBytes: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        contentType: { "type": "string", "maxLength": 255, "nullable": true }
        checksumSha256: { "type": "string", "maxLength": 64, "pattern": "^[a-f0-9]{64}$", "nullable": true }
      required: [ "currentVersionId", "contentRevision", "sizeBytes", "contentType", "checksumSha256" ]
    Node:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        parentId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        type:
          type: "string"
          enum: [ "FILE", "FOLDER" ]
        name: { "type": "string", "maxLength": 255 }
        path: { "$ref": "#/components/schemas/LogicalPath" }
        markers: { "$ref": "#/components/schemas/Markers" }
        revision:
          "$ref": "#/components/schemas/Revision"
          description: "Metadata CAS. Для операций над bytes использовать file.contentRevision, не этот revision."
        status:
          type: "string"
          enum: [ "ACTIVE", "TRASHED", "PURGING" ]
        createdAt: { "type": "string", "format": "date-time" }
        updatedAt: { "type": "string", "format": "date-time" }
        trashedAt: { "type": "string", "format": "date-time", "nullable": true }
        file: { "$ref": "#/components/schemas/FileContent" }
      required: [ "id", "spaceId", "parentId", "type", "name", "path", "markers", "revision", "status", "createdAt", "updatedAt" ]
      description: "file присутствует только для FILE. Root имеет parentId=null. Файл без опубликованного upload имеет currentVersionId=null, чтение bytes даёт 409 CONTENT_NOT_READY. path вычисляется из namespace. tree_path — внутренний индекс папок; treePath/tree_path в body запрещены и в ответ не включаются."
      example:
        id: "123e4567-e89b-12d3-a456-426614174000"
        spaceId: "223e4567-e89b-12d3-a456-426614174000"
        parentId: "323e4567-e89b-12d3-a456-426614174000"
        type: "FILE"
        name: "callsequence"
        path: "/tests/payment/callsequence"
        markers: [ "REFERENCE", "TEST_CASE" ]
        revision: 7
        status: "ACTIVE"
        createdAt: "2026-10-08T10:00:00Z"
        updatedAt: "2026-10-08T10:00:00Z"
        file:
          currentVersionId: "423e4567-e89b-12d3-a456-426614174000"
          contentRevision: 3
          sizeBytes: 1024
          contentType: "text/plain"
          checksumSha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    CreateNode:
      type: "object"
      additionalProperties: false
      properties:
        parentId: { "type": "string", "maxLength": 36, "format": "uuid" }
        type:
          type: "string"
          enum: [ "FILE", "FOLDER" ]
        name: { "$ref": "#/components/schemas/NodeName" }
        markers: { "$ref": "#/components/schemas/MarkerInput" }
      required: [ "parentId", "type", "name" ]
      description: "FILE создаёт пустой metadata placeholder; загрузка через upload session. Для настоящего файла 0 bytes также требуется finalize upload. Родитель ACTIVE FOLDER в том же space. Create использует exclusive structural space lock; maxDepth проверяется до commit; authorization_revision повышается. tree_path — внутренний индекс папок; treePath/tree_path в body запрещены и в ответ не включаются."
    RenameNode:
      type: "object"
      additionalProperties: false
      properties:
        name: { "$ref": "#/components/schemas/NodeName" }
      required: [ "name" ]
      description: "tree_path — внутренний индекс папок; treePath/tree_path в body запрещены и в ответ не включаются."
    MoveNode:
      type: "object"
      additionalProperties: false
      properties:
        targetParentId: { "type": "string", "maxLength": 36, "format": "uuid" }
        name: { "$ref": "#/components/schemas/NodeName" }
      required: [ "targetParentId" ]
      description: "В том же space; name отсутствует — сохранить имя. Запрещены циклы, move корня и перенос внутрь собственного поддерева; конфликт siblings не перезаписывается. tree_path — внутренний индекс папок; treePath/tree_path в body запрещены и в ответ не включаются."
    UpdateMarkers:
      type: "object"
      additionalProperties: false
      properties:
        markers: { "$ref": "#/components/schemas/MarkerInput" }
      required: [ "markers" ]
      description: "Полная замена набора. Идемпотентный no-op при том же наборе и актуальном If-Match. Не меняет contentRevision/S3."
    RestoreTrash:
      type: "object"
      additionalProperties: false
      properties:
        targetParentId: { "type": "string", "maxLength": 36, "format": "uuid" }
        name: { "$ref": "#/components/schemas/NodeName" }
      description: "По умолчанию прежние parent/name; при удалённом родителе требуется активная targetParentId. Коллизия — 409; ACL остаётся текущим. tree_path — внутренний индекс папок; treePath/tree_path в body запрещены и в ответ не включаются."
    NodeRevision:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        nodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        revision: { "$ref": "#/components/schemas/Revision" }
        parentNodeId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        name: { "type": "string", "maxLength": 255 }
        markers: { "$ref": "#/components/schemas/Markers" }
        status:
          type: "string"
          enum: [ "ACTIVE", "TRASHED" ]
        fileVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        validFrom: { "type": "string", "format": "date-time" }
        validTo: { "type": "string", "format": "date-time", "nullable": true }
        operationId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        actorId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
      required: [ "id", "nodeId", "revision", "name", "markers", "status", "validFrom", "validTo" ]
    Version:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        fileNodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        versionNumber: { "type": "integer", "format": "int64", "minimum": 1 }
        sizeBytes: { "type": "integer", "format": "int64", "minimum": 0 }
        checksumSha256: { "type": "string", "maxLength": 64, "pattern": "^[a-f0-9]{64}$" }
        contentType: { "type": "string", "maxLength": 255 }
        charset: { "type": "string", "maxLength": 64, "nullable": true }
        origin:
          type: "string"
          enum: [ "UPLOAD", "CORRECTOR", "JOB_ROLLBACK", "TREE_RESTORE", "COPY", "VERSION_RESTORE" ]
        status:
          type: "string"
          enum: [ "STAGED", "AVAILABLE", "RETIRED" ]
        sourceVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        operationId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        createdAt: { "type": "string", "format": "date-time" }
        createdBy: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        current: { "type": "boolean" }
      required:
        - "id"
        - "fileNodeId"
        - "versionNumber"
        - "sizeBytes"
        - "checksumSha256"
        - "contentType"
        - "origin"
        - "status"
        - "createdAt"
        - "current"
      description: "Публичный список обычно AVAILABLE; STAGED/RETIRED только административные detail. Номера монотонны, пробелы после GC допустимы; immutable bytes."
    RestoreVersion:
      type: "object"
      additionalProperties: false
      properties:
        versionId: { "type": "string", "maxLength": 36, "format": "uuid" }
      required: [ "versionId" ]
      description: "Публикует новую file_version с origin VERSION_RESTORE, переиспользуя immutable content_object. Не откатывает name/markers/ACL. Перед реализацией требуется добавить origin VERSION_RESTORE в PUML."
    NewUpload:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - NEW
        parentId:
          type: string
          maxLength: 36
          format: uuid
        name:
          $ref: "#/components/schemas/NodeName"
        expectedSizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        expectedChecksumSha256:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        contentType:
          type: string
          maxLength: 255
          minLength: 1
        charset:
          type: string
          maxLength: 64
      required:
        - mode
        - parentId
        - name
        - contentType
      description: "Только session NEW, не create FILE placeholder. Если placeholder уже создан, использовать UPDATE с null baseVersionId. expectedSizeBytes может отсутствовать или быть NULL: поток неизвестной длины ограничивается серверным maxFileBytes; фактические размер и SHA-256 проверяются до публикации."
    UpdateUpload:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
            - UPDATE
        fileNodeId:
          type: string
          maxLength: 36
          format: uuid
        expectedContentRevision:
          type: integer
          format: int64
          minimum: 0
        baseVersionId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        expectedSizeBytes:
          type: integer
          format: int64
          minimum: 0
          nullable: true
        expectedChecksumSha256:
          type: string
          maxLength: 64
          pattern: ^[a-f0-9]{64}$
        contentType:
          type: string
          maxLength: 255
          minLength: 1
        charset:
          type: string
          maxLength: 64
      required:
        - mode
        - fileNodeId
        - expectedContentRevision
        - baseVersionId
        - contentType
      description: "baseVersionId=null только у placeholder и contentRevision=0. Защищает публикацию содержимого, не блокирует rename/markers. expectedSizeBytes может отсутствовать или быть NULL: поток неизвестной длины ограничивается серверным maxFileBytes; фактические размер и SHA-256 проверяются до публикации."
    CreateUpload:
      oneOf:
        - { "$ref": "#/components/schemas/NewUpload" }
        - { "$ref": "#/components/schemas/UpdateUpload" }
      discriminator:
        propertyName: "mode"
        mapping: { "NEW": "#/components/schemas/NewUpload", "UPDATE": "#/components/schemas/UpdateUpload" }
    Upload:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        status:
          type: "string"
          enum: [ "INITIATED", "UPLOADING", "VERIFYING", "COMPLETED", "ABORTED", "EXPIRED", "FAILED" ]
        parentId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        fileNodeId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        expectedSizeBytes: { "type": "integer", "format": "int64", "minimum": 0, nullable: true }
        uploadedBytes: { "type": "integer", "format": "int64", "minimum": 0 }
        resultVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        expiresAt: { "type": "string", "format": "date-time" }
        createdAt: { "type": "string", "format": "date-time" }
        errorCode: { "type": "string", "maxLength": 64, "nullable": true }
        transferStatus:
          type: string
          enum:
            - NONE
            - RESERVED
            - UPLOADING
            - UPLOADED
            - VERIFYING
            - VERIFIED
            - FAILED
            - ABORTED
            - EXPIRED
          description: Состояние current attempt; NONE до первого PUT. Отличает активный writer от полного receipt после потери HTTP ответа.
        attemptNumber:
          type: integer
          minimum: 0
          description: Номер текущей попытки; 0 до первого PUT. uploadedBytes может обнулиться при новой попытке.
      required:
        - id
        - spaceId
        - status
        - expectedSizeBytes
        - expiresAt
        - createdAt
        - transferStatus
        - attemptNumber
        - uploadedBytes
      description: "Session хранит intent; attempts имеют разные immutable keys. uploadedBytes — snapshot текущей попытки, не суммарный traffic и не publication receipt. expectedSizeBytes=null при неизвестной длине. GET после потери ответа определяет состояние; COMPLETED replay не создаёт новую версию. Resume с byte offset не поддерживается."
    CompleteUpload:
      type: "object"
      additionalProperties: false
      properties:
        checksumSha256: { "type": "string", "maxLength": 64, "pattern": "^[a-f0-9]{64}$" }
      description: "Verify size/checksum + content CAS + публикация атомарно в PostgreSQL; I/O вне TX. Повтор complete той же session возвращает прежний результат. Ошибка не создаёт новую current version."
    DownloadLinkRequest:
      type: "object"
      additionalProperties: false
      properties:
        versionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        expiresInSeconds: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 3600, "default": 60 }
        disposition:
          type: "string"
          enum: [ "INLINE", "ATTACHMENT" ]
          default: "ATTACHMENT"
      description: "Без versionId фиксируется current version в момент выдачи. TTL не больше эффективного maxPresignTtlSeconds. Временно подписанная ссылка — bearer credential; отзыв ACL не отменяет её немедленно."
    DownloadLink:
      type: "object"
      additionalProperties: false
      properties:
        url: { "type": "string", "maxLength": 8192, "format": "uri" }
        versionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        expiresAt: { "type": "string", "format": "date-time" }
        method:
          type: "string"
          enum: [ "GET" ]
      required: [ "url", "versionId", "expiresAt", "method" ]
      description: "Выбранная версия удерживается от GC до expiresAt. Клиент не подменяет bucket/key. Не логировать URL."
    Selection:
      type: "object"
      additionalProperties: false
      properties:
        rootNodeIds:
          type: "array"
          items: { "type": "string", "maxLength": 36, "format": "uuid" }
          maxItems: 1000
          minItems: 1
          uniqueItems: true
        excludeNodeIds:
          type: "array"
          items: { "type": "string", "maxLength": 36, "format": "uuid" }
          maxItems: 1000
          uniqueItems: true
          default: []
        recursive: { "type": "boolean", "default": true }
      required: [ "rootNodeIds" ]
      description: "Все ROOT/EXCLUDE принадлежат указанному space. ROOT может FILE или FOLDER; EXCLUDE вычитает поддерево. Пересечения нормализуются по ancestry ID, не строковому startsWith. Отсутствие корней не означает весь space. Current ancestry проверяется через ltree FOLDER; FILE принадлежит scope через путь parent. Историческая selection на T использует node_revision.parent_node_id."
    FileFilter:
      type: "object"
      additionalProperties: false
      properties:
        field:
          type: "string"
          enum: [ "LOGICAL_PATH", "PREFIX", "PREFIX_PART", "FILENAME", "FILENAME_PART", "EXTENSION" ]
        operator:
          type: "string"
          enum: [ "STARTS_WITH", "CONTAINS", "ENDS_WITH", "EQUALS", "MATCHES_REGEX" ]
        value: { "type": "string", "maxLength": 4096, "minLength": 1 }
        caseSensitive: { "type": "boolean", "default": false }
        enabled: { "type": "boolean", "default": true }
      required: [ "field", "operator", "value" ]
      description: "S3_KEY legacy преобразуется в LOGICAL_PATH. PREFIX/PREFIX_PART — parent path. EXTENSION сравнивается без ведущей точки; regex использует bounded find, не полный match."
    FileQuery:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        matchMode:
          type: "string"
          enum: [ "ALL", "ANY" ]
          default: "ALL"
        rules:
          type: "array"
          items: { "$ref": "#/components/schemas/FileFilter" }
          maxItems: 1000
        markers:
          type: "array"
          items: { "$ref": "#/components/schemas/Marker" }
          maxItems: 3
          uniqueItems: true
        pageSize: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000, "default": 100 }
        cursor: { "type": "string", "maxLength": 8192 }
      required: [ "selection" ]
      description: "Metadata search из PostgreSQL. Имена и наличие файла не зависят от eventual OpenSearch. Cursor связан с tenant/space/filters; смена фильтра — 400 CURSOR_MISMATCH."
    FolderQuery:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        fileName: { "$ref": "#/components/schemas/NodeName" }
        fileMatch:
          type: "string"
          enum: [ "EXACT", "STARTS_WITH", "CONTAINS", "ENDS_WITH", "REGEX" ]
          default: "EXACT"
        fileLocation:
          type: "string"
          enum: [ "DIRECT_CHILD", "SUBTREE" ]
          default: "DIRECT_CHILD"
        ancestorLevels: { "type": "integer", "format": "int64", "minimum": 0, "maximum": 16, "default": 0 }
        pageSize: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000, "default": 100 }
        cursor: { "type": "string", "maxLength": 8192 }
      required: [ "selection", "fileName" ]
      description: "Папки с подходящим файлом; ancestorLevels=0 — содержащая папка, 2 — подняться на два родителя (legacy request discovery). После подъёма scope/ACL проверяются снова. Каждый folder ID один раз; отдаётся полный path."
    TextSearch:
      type: "object"
      additionalProperties: false
      properties:
        rootNodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        scope:
          type: "string"
          enum: [ "DIRECT_CHILDREN", "SUBTREE" ]
          default: "SUBTREE"
        nodeType:
          type: "string"
          enum: [ "FILE", "FOLDER", "ALL" ]
          default: "ALL"
        mode:
          type: "string"
          enum: [ "NAME", "CONTENT", "BOTH" ]
          default: "BOTH"
        q: { "type": "string", "maxLength": 4096, "minLength": 1 }
        pageSize: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1000, "default": 25 }
        cursor: { "type": "string", "maxLength": 8192 }
      required: [ "rootNodeId", "q" ]
      description: "OpenSearch eventual consistency. Контент папок не существует; поиск папок — name/path. ACL/existence/markers сверяются с PostgreSQL до ответа и до раскрытия snippet. Нет exact total при фильтрации прав."
    SearchHit:
      type: "object"
      additionalProperties: false
      properties:
        node: { "$ref": "#/components/schemas/Node" }
        score: { "type": "number" }
        snippet: { "type": "string", "maxLength": 2048 }
      required: [ "node" ]
      description: "snippet только при актуальном READ; plain text, фронт экранирует HTML. Path/markers из PostgreSQL."
    Replacement:
      type: "object"
      additionalProperties: false
      properties:
        mode:
          type: "string"
          enum: [ "TEXT", "REGEX" ]
          default: "TEXT"
        find: { "type": "string", "maxLength": 8192, "minLength": 1 }
        replaceWith: { "type": "string", "maxLength": 65536, "default": "" }
        caseSensitive: { "type": "boolean", "default": false }
        replaceAll: { "type": "boolean", "default": true }
        enabled: { "type": "boolean", "default": true }
      required: [ "find" ]
      description: "В порядке списка. TEXT использует literal find/replaceWith. REGEX Java-compatible syntax с runtime budgets, replacement поддерживает $1/${name}; escaping документируется engine. Старые TEXT rules с $/backslash требуют проверки миграции. Нет совпадений — UNCHANGED."
    TextDefinition:
      type: "object"
      additionalProperties: false
      properties:
        schemaVersion: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1, "default": 1 }
        selectionLimit: { "$ref": "#/components/schemas/Selection" }
        matchMode:
          type: "string"
          enum: [ "ALL", "ANY" ]
          default: "ALL"
        rules:
          type: "array"
          items: { "$ref": "#/components/schemas/FileFilter" }
          maxItems: 1000
        note: { "type": "string", "maxLength": 4096 }
        replacements:
          type: "array"
          items: { "$ref": "#/components/schemas/Replacement" }
          maxItems: 1000
          minItems: 1
        charset: { "type": "string", "maxLength": 64, "default": "UTF-8" }
        invalidTextPolicy:
          type: "string"
          enum: [ "FAIL", "SKIP" ]
          default: "FAIL"
      required: [ "replacements" ]
      description: "selectionLimit только сужает job selection, не расширяет её. Минимум одна включённая замена. Бинарные/слишком большие для transform файлы получают явный исход."
    CallStageFilter:
      type: "object"
      additionalProperties: false
      properties:
        callName: { "type": "string", "maxLength": 255, "minLength": 1 }
        stages:
          type: "array"
          items: { "type": "string", "maxLength": 255, "minLength": 1 }
          maxItems: 1000
          minItems: 1
          uniqueItems: true
      required: [ "callName", "stages" ]
    JsonTargetFilter:
      type: "object"
      additionalProperties: false
      properties:
        targetFilterType: { "type": "string", "maxLength": 64 }
        targetCallListFilter:
          type: "array"
          items: { "$ref": "#/components/schemas/CallStageFilter" }
          maxItems: 1000
      description: "Сохраняет legacy структуру. Тип фильтра/семантика проверяются при validation по engineVersion, неподдерживаемый тип — 422."
    JsonEditField:
      type: "object"
      additionalProperties: false
      properties:
        isDirectValue: { "type": "boolean" }
        editedPayloadField: { "type": "string", "maxLength": 4096 }
        targetAddress: { "type": "string", "maxLength": 4096 }
        targetFilter: { "$ref": "#/components/schemas/JsonTargetFilter" }
        payLoad:
          type: "array"
          items: { "$ref": "#/components/schemas/JsonPayload" }
          maxItems: 1000
        extractFieldAddress: { "type": "string", "maxLength": 4096 }
        editorMatchType: { "type": "string", "enum": [ "equals", "contains", "contains_" ] }
        replaceInExtractedFieldValueFrom: {}
        replaceInExtractedFieldValueTo: {}
      description: "Сохраняет direct/extracted value, nested payload, matching и replacement legacy корректоров. Комбинация полей проверяется engine до сохранения версии."
    JsonPayload:
      type: "object"
      additionalProperties: false
      properties:
        payloadObject:
          type: "array"
          items: {}
          maxItems: 1000
        targetAddress: { "type": "string", "maxLength": 4096 }
        payLoad:
          type: "array"
          items: { "$ref": "#/components/schemas/JsonPayload" }
          maxItems: 1000
        editFields:
          type: "array"
          items: { "$ref": "#/components/schemas/JsonEditField" }
          maxItems: 1000
      description: "Вложенность ограничена capabilities/engine budget; payloadObject содержит произвольные JSON значения, не исполняемый код."
    JsonTask:
      type: "object"
      additionalProperties: false
      properties:
        taskSequence: { "type": "integer", "format": "int64", "minimum": 0 }
        targetAddress: { "type": "string", "maxLength": 4096 }
        taskType:
          type: "string"
          enum: [ "insert", "edit", "delete", "replace" ]
        taskTargetSource:
          type: "string"
          enum: [ "request", "response", "both" ]
          default: "both"
          description: "both нормализуется в отсутствие source ограничения; это явный API-код вместо legacy null/empty."
        deleteAddress: { "type": "string", "maxLength": 4096 }
        globalDeleteAddress: { "type": "string", "maxLength": 4096 }
        applyToWholeJson: { "type": "boolean", "default": false }
        targetFilter: { "$ref": "#/components/schemas/JsonTargetFilter" }
        payLoad:
          type: "array"
          items: { "$ref": "#/components/schemas/JsonPayload" }
          maxItems: 1000
      required: [ "taskSequence", "taskType" ]
      description: "Порядок taskSequence уникален. Path syntax LEGACY_HYPHEN поддерживает существующие адреса с обходом массивов; не выдаётся за JSONPath/JSON Pointer. Обязательность address/payload зависит от типа, validation endpoint сообщает field violations."
    JsonDefinition:
      type: "object"
      additionalProperties: false
      properties:
        schemaVersion: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1, "default": 1 }
        pathSyntax:
          type: "string"
          enum: [ "LEGACY_HYPHEN" ]
          default: "LEGACY_HYPHEN"
        tasks:
          type: "array"
          items: { "$ref": "#/components/schemas/JsonTask" }
          maxItems: 1000
          minItems: 1
        invalidJsonPolicy:
          type: "string"
          enum: [ "FAIL", "SKIP" ]
          default: "FAIL"
        missingPathPolicy:
          type: "string"
          enum: [ "FAIL", "SKIP" ]
          default: "SKIP"
        allowComments: { "type": "boolean", "default": true }
        testCaseDiscovery:
          type: "object"
          additionalProperties: false
          properties:
            anchorFolderName: { "type": "string", "maxLength": 255, "default": "request" }
            ancestorLevels: { "type": "integer", "format": "int64", "minimum": 0, "maximum": 16, "default": 2 }
      required: [ "tasks" ]
      description: "Сохраняет TEST_JSON task/payload/edit/filter поведение. target source both превращается в legacy отсутствие ограничения. Контекст call/stage/source строится из logical layout testCase/call/request|response/stage.json|txt. Атомарность — один файл, не вся testCase folder."
    Expression:
      type: "object"
      additionalProperties: false
      properties:
        language:
          type: "string"
          enum: [ "SPRUT_DSL" ]
        expression: { "type": "string", "maxLength": 8192, "minLength": 1 }
        parameters: { "type": "object", "additionalProperties": true }
      required: [ "language", "expression" ]
      description: "Только зарегистрированный sandbox DSL, нет Java/SpEL eval, network/file/system доступа. Невоспроизводимые значения snapshot на job/item. Реальный grammar зависит от зарегистрированного engineVersion."
    ParamDefinition:
      type: "object"
      additionalProperties: false
      properties:
        schemaVersion: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 1, "default": 1 }
        selectionLimit: { "$ref": "#/components/schemas/Selection" }
        matchMode:
          type: "string"
          enum: [ "ALL", "ANY" ]
          default: "ALL"
        rules:
          type: "array"
          items: { "$ref": "#/components/schemas/FileFilter" }
          maxItems: 1000
        note: { "type": "string", "maxLength": 4096 }
        modes:
          type: "array"
          items:
            type: "string"
            enum: [ "DATE", "CUSTOMER_REQUEST_EXT_ID" ]
          maxItems: 2
          minItems: 1
          uniqueItems: true
        customExpressions:
          type: "array"
          items: { "$ref": "#/components/schemas/Expression" }
          maxItems: 1000
          minItems: 1
        timezone: { "type": "string", "maxLength": 64, "default": "UTC" }
        evaluationTime: { "type": "string", "format": "date-time" }
        seed: { "type": "string", "maxLength": 128 }
      anyOf:
        - { "required": [ "modes" ] }
        - { "required": [ "customExpressions" ] }
      description: "Нужны modes или customExpressions. DATE параметризует даты в относительные today/date-time placeholders с сохранением business sentinel exceptions; reference date фиксируется в snapshot. CUSTOMER_REQUEST_EXT_ID заменяет loanRequestId на [loanRequestId], customer/loan external ID на [customerRequestExtId], не генерирует новые ID. Семантика зафиксирована engineVersion; retries воспроизводимы."
    PluginDefinition:
      type: "object"
      additionalProperties: false
      properties:
        pluginId: { "type": "string", "maxLength": 64, "pattern": "^[A-Za-z][A-Za-z0-9_.-]{0,63}$" }
        configuration: { "type": "object", "additionalProperties": true }
      required: [ "pluginId", "configuration" ]
      description: "Только зарегистрированные безопасные plugins. Сервер валидирует configuration по plugin schema; неизвестный plugin отвергается."
    TextRule:
      type: "object"
      additionalProperties: false
      properties:
        engineVersion: { "type": "string", "maxLength": 64, "minLength": 1 }
        type:
          type: "string"
          enum: [ "TXT_REGULAR" ]
        definition: { "$ref": "#/components/schemas/TextDefinition" }
      required: [ "engineVersion", "type", "definition" ]
      example:
        type: "TXT_REGULAR"
        engineVersion: "sprut-text-v1"
        definition:
          schemaVersion: 1
          matchMode: "ALL"
          rules:
            - { "field": "FILENAME", "operator": "EQUALS", "value": "callsequence", "caseSensitive": false, "enabled": true }
          replacements:
            - { "mode": "TEXT", "find": "OLD_VALUE", "replaceWith": "NEW_VALUE", "caseSensitive": true, "replaceAll": true, "enabled": true }
          charset: "UTF-8"
          invalidTextPolicy: "FAIL"
    JsonRule:
      type: "object"
      additionalProperties: false
      properties:
        engineVersion: { "type": "string", "maxLength": 64, "minLength": 1 }
        type:
          type: "string"
          enum: [ "TEST_JSON" ]
        definition: { "$ref": "#/components/schemas/JsonDefinition" }
      required: [ "engineVersion", "type", "definition" ]
      example:
        type: "TEST_JSON"
        engineVersion: "sprut-json-legacy-v1"
        definition:
          tasks:
            - taskSequence: 1
              taskType: "delete"
              taskTargetSource: "request"
              globalDeleteAddress: "debug"
              applyToWholeJson: true
    ParamRule:
      type: "object"
      additionalProperties: false
      properties:
        engineVersion: { "type": "string", "maxLength": 64, "minLength": 1 }
        type:
          type: "string"
          enum: [ "PARAMETRIZATION" ]
        definition: { "$ref": "#/components/schemas/ParamDefinition" }
      required: [ "engineVersion", "type", "definition" ]
      example:
        type: "PARAMETRIZATION"
        engineVersion: "sprut-param-v1"
        definition:
          schemaVersion: 1
          modes: [ "DATE", "CUSTOMER_REQUEST_EXT_ID" ]
          timezone: "UTC"
    PluginRule:
      type: "object"
      additionalProperties: false
      properties:
        engineVersion: { "type": "string", "maxLength": 64, "minLength": 1 }
        type:
          type: "string"
          enum: [ "CUSTOM" ]
        definition: { "$ref": "#/components/schemas/PluginDefinition" }
      required: [ "engineVersion", "type", "definition" ]
      description: "API type CUSTOM хранит corrector_type=pluginId, не отдельное значение enum PUML."
    RuleDefinition:
      oneOf:
        - { "$ref": "#/components/schemas/TextRule" }
        - { "$ref": "#/components/schemas/JsonRule" }
        - { "$ref": "#/components/schemas/ParamRule" }
        - { "$ref": "#/components/schemas/PluginRule" }
      discriminator:
        propertyName: "type"
        mapping:
          TXT_REGULAR: "#/components/schemas/TextRule"
          TEST_JSON: "#/components/schemas/JsonRule"
          PARAMETRIZATION: "#/components/schemas/ParamRule"
          CUSTOM: "#/components/schemas/PluginRule"
    CreateRuleSet:
      type: "object"
      additionalProperties: false
      properties:
        name: { "$ref": "#/components/schemas/NodeName" }
        rule: { "$ref": "#/components/schemas/RuleDefinition" }
      required: [ "name", "rule" ]
      description: "Одна TX создаёт rule_set и initial immutable rule_version."
    RuleSet:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        name: { "type": "string", "maxLength": 255 }
        status:
          type: "string"
          enum: [ "ACTIVE", "ARCHIVED" ]
        latestVersionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        latestVersionNumber: { "type": "integer", "format": "int64", "minimum": 1 }
        createdAt: { "type": "string", "format": "date-time" }
        createdBy: { "type": "string", "maxLength": 36, "format": "uuid" }
      required: [ "id", "spaceId", "name", "status", "latestVersionId", "latestVersionNumber", "createdAt", "createdBy" ]
      description: "latestVersion вычисляется, в БД pointer пока не обязателен."
    RuleVersion:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        ruleSetId: { "type": "string", "maxLength": 36, "format": "uuid" }
        versionNumber: { "type": "integer", "format": "int64", "minimum": 1 }
        rule: { "$ref": "#/components/schemas/RuleDefinition" }
        definitionHash: { "type": "string", "maxLength": 64 }
        createdAt: { "type": "string", "format": "date-time" }
        createdBy: { "type": "string", "maxLength": 36, "format": "uuid" }
      required: [ "id", "ruleSetId", "versionNumber", "rule", "definitionHash", "createdAt", "createdBy" ]
    UpdateRuleSet:
      type: "object"
      additionalProperties: false
      properties:
        name: { "$ref": "#/components/schemas/NodeName" }
        status:
          type: "string"
          enum: [ "ACTIVE", "ARCHIVED" ]
      minProperties: 1
      description: "CAS через обязательный If-Match вида rule-set:UUID:vN и corrector_rule_set.revision. Архивирование не меняет existing jobs."
    CreateRuleVersion:
      type: "object"
      additionalProperties: false
      properties:
        expectedLatestVersionNumber: { "type": "integer", "format": "int64", "minimum": 1 }
        rule: { "$ref": "#/components/schemas/RuleDefinition" }
      required: [ "expectedLatestVersionNumber", "rule" ]
      description: "CAS max version_number, UNIQUE(rule_set_id,version_number); immutable version. Name изменяется отдельным PATCH."
    Validation:
      type: "object"
      additionalProperties: false
      properties:
        valid: { "type": "boolean" }
        errors:
          type: "array"
          items:
            type: "object"
            additionalProperties: false
            properties:
              field: { "type": "string", "maxLength": 1024 }
              code: { "type": "string", "maxLength": 64 }
              message: { "type": "string", "maxLength": 1024 }
            required: [ "field", "code", "message" ]
          maxItems: 1000
        warnings:
          type: "array"
          items: { "type": "string", "maxLength": 1024 }
          maxItems: 1000
        normalizedRule: { "$ref": "#/components/schemas/RuleDefinition" }
      required: [ "valid", "errors", "warnings" ]
      description: "Структурно корректный body может дать valid=false при semantic errors; проверяет engine/regex/DSL, не читает все файлы и не является обязательным preview."
    CorrectorRequest:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        ruleVersionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        parameters: { "type": "object", "additionalProperties": true }
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      required: [ "selection", "ruleVersionId" ]
      description: "Запуск без подтверждения. Rule immutable snapshot, parameters ограничены конкретной schema. Подходящие файлы обнаруживаются страницами; base version фиксируется при discovery, не global snapshot."
    CopySource:
      type: "object"
      additionalProperties: false
      properties:
        nodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        versionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        name: { "$ref": "#/components/schemas/NodeName" }
      required: [ "nodeId" ]
      description: "versionId только для FILE и относится к nodeId; для папки snapshot пофайловый во время discovery. name переименовывает root копии."
    CopyRequest:
      type: "object"
      additionalProperties: false
      properties:
        sources:
          type: "array"
          items: { "$ref": "#/components/schemas/CopySource" }
          maxItems: 1000
          minItems: 1
        targetParentId: { "type": "string", "maxLength": 36, "format": "uuid" }
        collisionPolicy:
          type: "string"
          enum: [ "FAIL", "SKIP" ]
          default: "FAIL"
        excludeNodeIds:
          type: "array"
          items: { "type": "string", "maxLength": 36, "format": "uuid" }
          maxItems: 1000
          uniqueItems: true
          default: []
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      required: [ "sources", "targetParentId" ]
      description: "Новый nodeId для каждой копии, markers переносятся, ACL источника не копируется; применяются права destination. Между spaces требуются READ source/WRITE destination; переиспользование content_object только в одном space, иначе server-side transfer/checksum. Копирование папки в её поддерево отклоняется. Пересекающиеся sources нормализуются; неоднозначные name mappings — 422."
    DeleteRequest:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        mode:
          type: "string"
          enum: [ "TRASH", "PURGE" ]
          default: "TRASH"
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      required: [ "selection" ]
      description: "PURGE только ADMIN, после retention/holds. Не принимает force/includeVersions для обхода защиты. Активные/current/retained версии не удаляются физически. Поэлементные ошибки/конфликты; отмена PURGE не возвращает уже удалённые байты."
    ExportRequest:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        format:
          type: "string"
          enum: [ "ZIP" ]
          default: "ZIP"
        archiveName: { "type": "string", "maxLength": 255, "default": "download.zip" }
        collisionPolicy:
          type: "string"
          enum: [ "FAIL" ]
          default: "FAIL"
      required: [ "selection" ]
      description: "Durable manifest с version holds, bounded ZIP64 streaming в S3 artifact. Уникальные safe entry paths, без Zip Slip. Не global tree snapshot; ошибка чтения не выдаёт неполный archive как успешный. Artifact TTL конфигурационный."
    TreeRestoreRequest:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        restoreTo: { "type": "string", "format": "date-time" }
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      required: [ "selection", "restoreTo" ]
      description: "T с offset/Z; до restoreAvailableFrom — 410 RESTORE_POINT_EXPIRED. Состояние namespace/markers/current bytes на T, ACL не откатывается. Holds создаются до discovery; не atomic global tree snapshot. Технический tree_path не восстанавливается из исторического snapshot; он пересчитывается при публикации из актуальных parent links."
    RollbackRequest:
      type: "object"
      additionalProperties: false
      properties:
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      description: "Исходный job терминален; компенсация только его SUCCEEDED mutations. CAS результата, чужие изменения сохраняются как CONFLICT. Доступность base/result и перенос holds проверяются атомарно. PURGE/EXPORT rollback не поддерживается."
    RetryRequest:
      type: "object"
      additionalProperties: false
      properties:
        outcomes:
          type: "array"
          items:
            type: "string"
            enum: [ "FAILED", "CONFLICT" ]
          maxItems: 2
          minItems: 1
          uniqueItems: true
          default: [ "FAILED" ]
        maxParallelItems: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 64, "default": 4 }
      required: [ "outcomes" ]
      description: "Новое задание на выбранный subset, не сброс старых items. FAILED повторяется с исходным snapshot; CONFLICT требует нового явного запуска на current, здесь 422 REBASE_REQUIRED. Связь сохраняется в retry_of_job_id/retry_of_item_id. EXPORT не допускает subset retry; повтор сборки использует полный manifest."
    CancelRequest:
      type: "object"
      additionalProperties: false
      properties:
        mode:
          type: "string"
          enum: [ "STOP", "STOP_AND_ROLLBACK" ]
          default: "STOP"
      required: [ "mode" ]
      description: "STOP фиксирует cancellation boundary. STOP_AND_ROLLBACK сохраняет durable intent, удерживает base/result, затем после безопасной остановки создаёт связанный rollback. Не end-to-end atomic; конфликты могут оставить частичный откат. Для PURGE/EXPORT второй режим запрещён."
    JobStatus:
      type: "string"
      enum: [ "QUEUED", "RUNNING", "CANCEL_REQUESTED", "FINALIZING", "COMPLETED", "COMPLETED_WITH_ERRORS", "CANCELLED", "FAILED" ]
    JobType:
      type: "string"
      enum: [ "CORRECTOR", "JOB_ROLLBACK", "TREE_RESTORE", "COPY", "DELETE", "EXPORT" ]
    ItemStatus:
      type: "string"
      enum: [ "WAITING_DEPENDENCY", "PENDING", "RUNNING", "RETRY", "SUCCEEDED", "UNCHANGED", "CONFLICT", "FAILED", "CANCELLED" ]
    Progress:
      type: "object"
      additionalProperties: false
      properties:
        phase:
          type: "string"
          enum: [ "QUEUED", "DISCOVERING", "PROCESSING", "FINALIZING", "FINISHED" ]
        discoveryComplete: { "type": "boolean" }
        scannedNodes: { "type": "integer", "format": "int64", "minimum": 0 }
        discoveredItems: { "type": "integer", "format": "int64", "minimum": 0 }
        totalItems: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        terminalItems: { "type": "integer", "format": "int64", "minimum": 0 }
        succeeded: { "type": "integer", "format": "int64", "minimum": 0 }
        unchanged: { "type": "integer", "format": "int64", "minimum": 0 }
        conflicts: { "type": "integer", "format": "int64", "minimum": 0 }
        failed: { "type": "integer", "format": "int64", "minimum": 0 }
        cancelled: { "type": "integer", "format": "int64", "minimum": 0 }
        running: { "type": "integer", "format": "int64", "minimum": 0 }
        waitingRetry: { "type": "integer", "format": "int64", "minimum": 0 }
        logicalProcessedBytes: { "type": "integer", "format": "int64", "minimum": 0 }
        totalLogicalBytes: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        percent: { "type": "number", "minimum": 0, "maximum": 100, "nullable": true }
        estimatedRemainingSeconds: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        snapshotAt: { "type": "string", "format": "date-time" }
      required:
        - "phase"
        - "discoveryComplete"
        - "scannedNodes"
        - "discoveredItems"
        - "totalItems"
        - "terminalItems"
        - "succeeded"
        - "unchanged"
        - "conflicts"
        - "failed"
        - "cancelled"
        - "running"
        - "waitingRetry"
        - "logicalProcessedBytes"
        - "percent"
        - "snapshotAt"
      description: "Кэш статистики по уникальным items, не по retry. До discovery complete totalItems/percent=null. После complete percent=100*terminalItems/totalItems; для 0 items percent=100 только после discovery complete. Ошибки включены, не процент успеха. Cancel before complete оставляет total=null. phase не дополнительный job status. FINALIZING при processing 100% не означает завершённый job; ETA approximate."
      example:
        phase: "DISCOVERING"
        discoveryComplete: false
        scannedNodes: 9200
        discoveredItems: 8400
        totalItems: null
        terminalItems: 5100
        succeeded: 4700
        unchanged: 380
        conflicts: 12
        failed: 8
        cancelled: 0
        running: 8
        waitingRetry: 12
        logicalProcessedBytes: 1073741824
        percent: null
        snapshotAt: "2026-10-08T10:05:00Z"
    Job:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        type: { "$ref": "#/components/schemas/JobType" }
        status: { "$ref": "#/components/schemas/JobStatus" }
        createdBy: { "type": "string", "maxLength": 36, "format": "uuid" }
        createdAt: { "type": "string", "format": "date-time" }
        startedAt: { "type": "string", "format": "date-time", "nullable": true }
        finishedAt: { "type": "string", "format": "date-time", "nullable": true }
        selection: { "$ref": "#/components/schemas/Selection" }
        ruleVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        sourceJobId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        rollbackJobId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        rollbackAvailableUntil: { "type": "string", "format": "date-time", "nullable": true }
        progress: { "$ref": "#/components/schemas/Progress" }
        errorCode: { "type": "string", "maxLength": 64, "nullable": true }
        links:
          type: "object"
          additionalProperties: false
          properties:
            self: { "type": "string", "maxLength": 2048 }
            items: { "type": "string", "maxLength": 2048 }
          required: [ "self", "items" ]
        actorType:
          type: string
          enum:
            - USER
            - SERVICE
        correlationId:
          $ref: "#/components/schemas/CorrelationId"
      required:
        - id
        - spaceId
        - type
        - status
        - createdBy
        - createdAt
        - progress
        - links
        - actorType
        - correlationId
      description: "202 только после DB commit. JOB summary может пережить item retention; progress_snapshot не используется для решения о завершении. rollbackJobId — durable linked compensation cancel-намерения. COPY/DELETE/EXPORT входят в job_type. Исходный initiator/correlation и whitelist trace context сохраняются durable. Фоновые commit проверяют текущие ACL/роли и актуальность внешнего membership; токены и старый role snapshot не являются бессрочными полномочиями."
    JobItem:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        jobId: { "type": "string", "maxLength": 36, "format": "uuid" }
        nodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        pathSnapshot: { "type": "string", "maxLength": 4096 }
        operation: { "type": "string", "maxLength": 64 }
        status: { "$ref": "#/components/schemas/ItemStatus" }
        attempt: { "type": "integer", "format": "int64", "minimum": 0 }
        baseVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        resultVersionId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        resultNodeId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
        processedBytes: { "type": "integer", "format": "int64", "minimum": 0 }
        errorCode: { "type": "string", "maxLength": 64, "nullable": true }
        errorMessage: { "type": "string", "maxLength": 2048, "nullable": true }
        startedAt: { "type": "string", "format": "date-time", "nullable": true }
        finishedAt: { "type": "string", "format": "date-time", "nullable": true }
      required: [ "id", "jobId", "nodeId", "operation", "status", "attempt", "processedBytes" ]
      description: "pathSnapshot — audit display; stable ID authoritative. Без содержимого файлов и секретов. Для COPY_NODE resultNodeId — заранее выделенный node_id назначения после успешной публикации. Недоступные scope/node детали маскируются."
    CancelResult:
      type: "object"
      additionalProperties: false
      properties:
        job: { "$ref": "#/components/schemas/Job" }
        rollbackRequested: { "type": "boolean" }
        rollbackJobId: { "type": "string", "maxLength": 36, "format": "uuid", "nullable": true }
      required: [ "job", "rollbackRequested", "rollbackJobId" ]
    ExportArtifact:
      type: "object"
      additionalProperties: false
      properties:
        jobId: { "type": "string", "maxLength": 36, "format": "uuid" }
        status:
          type: "string"
          enum: [ "PREPARING", "AVAILABLE", "EXPIRED", "FAILED" ]
        name: { "type": "string", "maxLength": 255 }
        sizeBytes: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        checksumSha256: { "type": "string", "maxLength": 64, "nullable": true }
        expiresAt: { "type": "string", "format": "date-time", "nullable": true }
        contentUrl: { "type": "string", "maxLength": 2048, "nullable": true }
      required: [ "jobId", "status" ]
      description: "Файл доступен только после устойчивого успешного finalize; expired → 410. Artifact metadata model ещё не определена."
    Acl:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        nodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        subjectType:
          type: "string"
          enum:
            - USER
            - GROUP
            - SERVICE
            - ROLE
        subjectId: { "type": "string", "maxLength": 36, "format": "uuid" }
        permissions:
          type: "array"
          items:
            type: "string"
            enum: [ "READ", "WRITE", "DELETE", "SHARE", "ADMIN" ]
          maxItems: 5
          minItems: 0
          uniqueItems: true
        inheritanceMode:
          type: "string"
          enum: [ "SELF", "CHILDREN", "SUBTREE" ]
        createdAt: { "type": "string", "format": "date-time" }
        createdBy: { "type": "string", "maxLength": 36, "format": "uuid" }
        effective:
          type: boolean
          description: "Вычисленное участие grant в разрешении: ARCHIVED роль не даёт прав."
      required: [ "id", "nodeId", "subjectType", "subjectId", "permissions", "inheritanceMode", "createdAt" ]
      description: "USER/GROUP/SERVICE: subjectId и permissions → прямой permission_mask. ROLE: subjectId → role_id, permission_mask=NULL, permissions вычисляются из текущего role_permission; при ARCHIVED могут быть пустыми. SELF=узел, CHILDREN=прямые дети, SUBTREE=узел и потомки. ALLOW объединяются; дочерний grant не отменяет разрешение предка."
    CreateAcl:
      oneOf:
        - $ref: "#/components/schemas/CreateDirectAcl"
        - $ref: "#/components/schemas/CreateRoleBinding"
    HoldRequest:
      type: "object"
      additionalProperties: false
      properties:
        holderType:
          type: "string"
          enum: [ "USER_PIN", "SHARE", "LEGAL_HOLD" ]
        holderId: { "type": "string", "maxLength": 36, "format": "uuid" }
        expiresAt: { "type": "string", "format": "date-time" }
      required: [ "holderType", "holderId" ]
      description: "Внешние service consumers используют SHARE с service-owned holderId/TTL для execution/RAG/export. ACTIVE_JOB/INDEX_READ не доступны напрямую. LEGAL_HOLD — ADMIN, может быть бессрочным; другие types требуют expiresAt в будущем и ограниченный TTL."
    Hold:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        versionId: { "type": "string", "maxLength": 36, "format": "uuid" }
        holderType:
          type: "string"
          enum: [ "ACTIVE_JOB", "JOB_ROLLBACK", "RESTORE", "INDEX_READ", "USER_PIN", "LEGAL_HOLD", "SHARE" ]
        holderId: { "type": "string", "maxLength": 36, "format": "uuid" }
        createdAt: { "type": "string", "format": "date-time" }
        expiresAt: { "type": "string", "format": "date-time", "nullable": true }
        releasedAt: { "type": "string", "format": "date-time", "nullable": true }
      required: [ "id", "versionId", "holderType", "holderId", "createdAt", "expiresAt", "releasedAt" ]
    RetentionPolicy:
      type: "object"
      additionalProperties: false
      properties:
        id: { "type": "string", "maxLength": 36, "format": "uuid" }
        name: { "type": "string", "maxLength": 255, "minLength": 1 }
        versionRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        minVersionsPerFile: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 10000 }
        treeRestoreDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        trashRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobRollbackDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobDetailRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobSummaryRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        auditRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        gcGraceHours: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 876000 }
        orphanGraceHours: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 876000 }
        updatedAt: { "type": "string", "format": "date-time" }
      required:
        - "id"
        - "name"
        - "versionRetentionDays"
        - "minVersionsPerFile"
        - "treeRestoreDays"
        - "trashRetentionDays"
        - "jobRollbackDays"
        - "jobDetailRetentionDays"
        - "jobSummaryRetentionDays"
        - "auditRetentionDays"
        - "gcGraceHours"
        - "orphanGraceHours"
        - "updatedAt"
      description: "jobDetailRetentionDays >= jobRollbackDays; jobSummary >= jobDetail; holds/current/history защищены независимо от возраста. Сокращение окна не снимает holds. Максимумы схемы не задают значения по умолчанию."
    UpdateRetentionPolicy:
      type: "object"
      additionalProperties: false
      properties:
        expectedUpdatedAt: { "type": "string", "format": "date-time" }
        name: { "type": "string", "maxLength": 255, "minLength": 1 }
        versionRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        minVersionsPerFile: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 10000 }
        treeRestoreDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        trashRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobRollbackDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobDetailRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        jobSummaryRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        auditRetentionDays: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 36500 }
        gcGraceHours: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 876000 }
        orphanGraceHours: { "type": "integer", "format": "int64", "minimum": 1, "maximum": 876000 }
      required:
        - "expectedUpdatedAt"
        - "name"
        - "versionRetentionDays"
        - "minVersionsPerFile"
        - "treeRestoreDays"
        - "trashRetentionDays"
        - "jobRollbackDays"
        - "jobDetailRetentionDays"
        - "jobSummaryRetentionDays"
        - "auditRetentionDays"
        - "gcGraceHours"
        - "orphanGraceHours"
      description: "CAS по previous updatedAt; watermark cleanup сериализован со space/restore admission. Отсутствует force cleanup."
    AuditEvent:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          maxLength: 36
          format: uuid
        occurredAt:
          type: string
          format: date-time
        spaceId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        nodeId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        versionId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        operationId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        action:
          type: string
          enum:
            - CREATE
            - RENAME
            - MOVE
            - TRASH
            - RESTORE
            - VERSION_CREATE
            - GC_PURGE
            - ACL_CHANGE
            - MARKERS_CHANGE
            - ROLE_CHANGE
            - RETENTION_CHANGE
            - UPDATE
        actorId:
          type: string
          maxLength: 36
          format: uuid
          nullable: true
        requestId:
          type: string
          maxLength: 128
        beforeState:
          type: object
          additionalProperties: true
        afterState:
          type: object
          additionalProperties: true
        tenantId:
          type: string
          format: uuid
          maxLength: 36
        resourceType:
          type: string
          enum:
            - SPACE
            - NODE
            - FILE_VERSION
            - ROLE
            - RETENTION_POLICY
            - JOB
            - UPLOAD
            - SERVICE_SETTINGS
        resourceId:
          type: string
          format: uuid
          maxLength: 36
        actorType:
          type: string
          enum:
            - USER
            - SERVICE
          nullable: true
        callerId:
          type: string
          maxLength: 255
          nullable: true
        correlationId:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
          nullable: true
        traceId:
          type: string
          maxLength: 32
          nullable: true
        spanId:
          type: string
          maxLength: 16
          nullable: true
      required:
        - id
        - occurredAt
        - spaceId
        - action
        - tenantId
        - resourceType
        - resourceId
      description: Административные события до первого space имеют spaceId=null и tenant из конфигурации. Секреты и credential references редактируются/исключаются из before/after. Service-level retention задаётся внешней конфигурацией. Логические resource IDs не блокируют cleanup.
    ReindexRequest:
      type: "object"
      additionalProperties: false
      properties:
        selection: { "$ref": "#/components/schemas/Selection" }
        action:
          type: "string"
          enum: [ "UPSERT", "TOMBSTONE" ]
          default: "UPSERT"
      required: [ "selection" ]
      description: "ADMIN. UPSERT читает только authoritative metadata/current bytes. TOMBSTONE допустим только для реально удалённого/trashed узла; удаление поискового документа живого узла отдельно запрещено. Поиск нельзя использовать как источник ACL/истины."
    IndexTask:
      type: "object"
      additionalProperties: false
      properties:
        spaceId: { "type": "string", "maxLength": 36, "format": "uuid" }
        nodeId: { "type": "string", "maxLength": 36, "format": "uuid" }
        scope:
          type: "string"
          enum: [ "NODE", "SUBTREE" ]
        action:
          type: "string"
          enum: [ "UPSERT", "TOMBSTONE" ]
        status:
          type: "string"
          enum: [ "PENDING", "RUNNING", "RETRY", "DONE", "FAILED" ]
        desiredRevision: { "type": "integer", "format": "int64", "minimum": 0 }
        processingRevision: { "type": "integer", "format": "int64", "minimum": 0, "nullable": true }
        attempt: { "type": "integer", "format": "int64", "minimum": 0 }
        updatedAt: { "type": "string", "format": "date-time" }
        errorCode: { "type": "string", "maxLength": 64, "nullable": true }
      required: [ "spaceId", "nodeId", "scope", "action", "status", "desiredRevision", "attempt", "updatedAt" ]
