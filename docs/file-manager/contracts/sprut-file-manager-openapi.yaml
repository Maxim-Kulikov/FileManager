          format: int64
          minimum: 1
          maximum: 36500
        jobRollbackDays:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        jobDetailRetentionDays:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        jobSummaryRetentionDays:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        auditRetentionDays:
          type: integer
          format: int64
          minimum: 1
          maximum: 36500
        gcGraceHours:
          type: integer
          format: int64
          minimum: 1
          maximum: 876000
        orphanGraceHours:
          type: integer
          format: int64
          minimum: 1
          maximum: 876000
      required:
        - name
        - versionRetentionDays
        - minVersionsPerFile
        - treeRestoreDays
        - trashRetentionDays
        - jobRollbackDays
        - jobDetailRetentionDays
        - jobSummaryRetentionDays
        - auditRetentionDays
