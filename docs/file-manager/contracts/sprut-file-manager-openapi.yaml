          type: "string"
          enum: [ "DELETE_OBJECT", "ABORT_MULTIPART", "DELETE_LEGACY_SEARCH_DOCUMENT" ]
        status:
          type: "string"
          enum: [ "PENDING", "RUNNING", "RETRY", "DONE", "FAILED" ]
        attempt: { "type": "integer", "format": "int64", "minimum": 0 }
        deleteNotBefore: { "type": "string", "format": "date-time" }
        createdAt: { "type": "string", "format": "date-time" }
        finishedAt: { "type": "string", "format": "date-time", "nullable": true }
        errorCode: { "type": "string", "maxLength": 64, "nullable": true }
      required: [ "id", "spaceId", "type", "status", "attempt", "deleteNotBefore", "createdAt" ]
