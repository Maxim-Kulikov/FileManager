        tasksUrl: { "type": "string", "maxLength": 2048 }
      required: [ "spaceId", "acceptedRoots", "acceptedAt", "tasksUrl" ]
      description: "Корни поставлены как durable SUBTREE tasks в той же TX. Нет выдуманного jobId для таблицы без job ID."
    GcTask:
      type: "object"
      additionalProperties: false
      properties:
