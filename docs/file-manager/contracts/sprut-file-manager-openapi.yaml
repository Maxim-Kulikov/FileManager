        - CREATE_SPACE
        - MANAGE_RETENTION_POLICIES
        - MANAGE_ROLES
        - READ_ROLE_CATALOG
        - VIEW_SERVICE_AUDIT
      description: Разрешения уровня сервиса. Только доверенная серверная политика; файловые роли не могут их содержать.
