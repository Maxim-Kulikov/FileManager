      summary: "Остановить или остановить с компенсацией"
      operationId: "cancelJob"
      description: "STOP запрещает новые публикации после commit CANCEL_REQUESTED; успешные results остаются. STOP_AND_ROLLBACK сохраняет intent и создаёт связанную компенсацию после остановки. Повтор того же mode идемпотентен; другой принятый mode — 409, автоматического upgrade нет. Уже COMPLETED + STOP не отменяет результат; rollback вызывается отдельно. PURGE/EXPORT/VERSION_RETIREMENT и сама компенсация не поддерживают STOP_AND_ROLLBACK."
