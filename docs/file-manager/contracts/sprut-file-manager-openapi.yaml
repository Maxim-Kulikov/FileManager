      summary: Навигационная цепочка root→parent
      operationId: getNodeAncestors
      description: "Видимые предки в порядке root→parent, без самого node. Для root items=[]. При недоступном ancestor — 404 без частичной цепочки. Глубина ограничена maxDepth. UUID предков берутся из tree_path папки без собственной метки либо из полной цепочки parent для FILE. Проверяются parent_id, полнота цепочки и maxDepth; Recursive CTE текущего дерева не требуется."
      x-permission: READ
      x-db-status: covered
      parameters:
