      description: Один writer на session; второй получает 409 UPLOAD_IN_PROGRESS. Claim создаёт новый upload_attempt и отдельный RESERVED content_object/key; byte counter и SHA-256 вычисляются потоково. Сетевой I/O вне TX. После полного receipt сохраняется UPLOADED; это ещё не публикация. Retry после failed/expired attempt использует ту же session с новой попыткой. Пока предыдущая попытка активна — 409. Повтор после полного receipt — 409, затем GET/complete. Resume с offset и клиентское multipart parts API не поддерживаются.
