    FilePermission:
      type: string
      enum:
        - READ
        - WRITE
        - DELETE
        - SHARE
        - ADMIN
      description: Фиксированные действия backend. ADMIN — scoped административные операции/управление доступом; не platform role и не неявный READ/WRITE. Произвольные права через UI не создаются.
    PlatformPermission:
      type: string
      enum:
